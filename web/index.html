<!DOCTYPE html>
<html>
<head>
    <base href="$FLUTTER_BASE_HREF">

    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Atlas+, a private media app for family and friends.">

    <!-- Browser chrome (mobile status/address bar areas) matches the app -->
    <meta name="theme-color" content="#0E0F12">
    <meta name="color-scheme" content="dark">

    <!-- iOS meta tags & icons -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Atlas+">
    <link rel="apple-touch-icon" href="icons/Icon-192.png">

    <link rel="icon" type="image/png" href="favicon.png"/>
    <link rel="preload" href="icons/Icon-192.png" as="image">

    <title>Atlas+</title>
    <link rel="manifest" href="manifest.json">

    <style>
        html, body {
          margin: 0;
          height: 100%;
          background: var(--atlas-bg, #0E0F12);
          overscroll-behavior: none;
        }
        #atlas-splash {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 28px;
          background:
            radial-gradient(60% 50% at 50% 42%, rgba(74, 107, 246, 0.18), transparent 70%),
            var(--atlas-bg, #0E0F12);;
          transition: opacity 280ms ease;
        }
        #atlas-splash.hide { opacity: 0; pointer-events: none; }
        #atlas-splash img {
          width: 96px;
          height: 96px;
          border-radius: 24px;
          box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5), 0 0 40px rgba(74, 107, 246, 0.25);
          animation: atlas-breathe 2.4s ease-in-out infinite;
        }
        #atlas-splash .bar {
          width: 140px;
          height: 3px;
          border-radius: 3px;
          background: rgba(255, 255, 255, 0.08);
          overflow: hidden;
        }
        #atlas-splash .bar::after {
          content: "";
          display: block;
          width: 40%;
          height: 100%;
          border-radius: 3px;
          background: linear-gradient(90deg, #4A6BF6, #7590FF);
          animation: atlas-slide 1.1s ease-in-out infinite;
        }
        @keyframes atlas-slide {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(250%); }
        }
        @keyframes atlas-breathe {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.04); }
        }
        @media (prefers-reduced-motion: reduce) {
          #atlas-splash img, #atlas-splash .bar::after { animation: none; }
        }
    </style>
    <script>
        // Start in the last theme's color instead of the default dark.
        try {
          var bg = localStorage.getItem('atlas_bg');
          if (bg) {
            document.documentElement.style.setProperty('--atlas-bg', bg);
            document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
          }
        } catch (e) {}
    </script>
</head>
<body>
<!-- Shows instantly while Flutter downloads and starts -->
<div id="atlas-splash" aria-label="Loading Atlas+">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
</div>
<script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('atlas-splash');
      if (!s) return;
      s.classList.add('hide');
      setTimeout(function () { s.remove(); }, 400);
    });
</script>

<script src="hls.min.js" defer></script>
<script src="flutter_bootstrap.js" async></script>
</body>
</html>
