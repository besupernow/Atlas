name: Build Atlas
run-name: ${{ inputs.release_tag != '' && format('Atlas release {0}', inputs.release_tag) || format('Atlas build {0}', github.sha) }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag for a draft release (e.g. 1.0.0); leave empty to only produce Actions artifacts
        default: ''
        type: string
      build_android:
        description: Android + Android TV + Fire TV (one APK set)
        default: true
        type: boolean
      build_ios:
        description: iOS (unsigned IPA)
        default: false
        type: boolean
      build_macos:
        description: macOS (unsigned app in a zip)
        default: false
        type: boolean
      build_windows:
        description: Windows x64
        default: false
        type: boolean
      build_linux:
        description: Linux x64
        default: false
        type: boolean

env:
  FLUTTER_VERSION: "3.47.1"
  # No Sentry, donations or upstream update check in the family build.
  DART_DEFINES: --dart-define=ENABLE_UPDATE_CHECK=false --dart-define=GIT_COMMIT=${{ github.sha }} --dart-define=SUPPORTER_MODE=unlocked
  LINUX_APT_PACKAGES: >
    clang cmake meson ninja-build pkg-config nasm libgtk-3-dev libevdev-dev liblzma-dev
    libstdc++-12-dev libasound2-dev libass-dev libfreetype-dev libfontconfig-dev libfribidi-dev
    libharfbuzz-dev libepoxy-dev libegl-dev libgl-dev libgnutls28-dev libpipewire-0.3-dev
    libva-dev libvdpau-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev
    libxss-dev libxpresent-dev libxkbcommon-dev libpulse-dev libdbus-1-dev libdrm-dev
    libdisplay-info-dev libgbm-dev libwayland-dev wayland-protocols liblcms2-dev libmujs-dev liblua5.2-dev
    build-essential libcurl4-openssl-dev zstd

jobs:
  android:
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # NOT --enforce-lockfile: you added video_player, so commit the updated
      # pubspec.lock (or this still works and just resolves it).
      - run: flutter pub get

      - name: Configure signing
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          PROPS

      - name: Build APKs
        run: flutter build apk --release --split-per-abi ${{ env.DART_DEFINES }}

      - name: Name the files
        run: |
          mkdir out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   out/atlas-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/atlas-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk      out/atlas-x86_64.apk

      - name: Clean up keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  ios:
    if: ${{ inputs.build_ios }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign ${{ env.DART_DEFINES }}
      - name: Package IPA
        run: |
          APP=$(find build/ios/iphoneos -maxdepth 1 -name "*.app" | head -1)
          mkdir -p Payload && cp -r "$APP" Payload/
          zip -r atlas-ios.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: atlas-ios.ipa

  macos:
    if: ${{ inputs.build_macos }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Build macOS
        run: flutter build macos --release ${{ env.DART_DEFINES }}
      - name: Zip app
        run: |
          APP=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          ditto -c -k --keepParent "$APP" atlas-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: atlas-macos.zip

  windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
        shell: pwsh
      - name: Install patched Flutter engine (DComp)
        shell: pwsh
        run: |
          flutter precache --windows
          .\windows\tool\install-patched-engine.ps1
      - name: Build Windows
        shell: pwsh
        run: flutter build windows --release ${{ env.DART_DEFINES }}
      - name: Zip portable build
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath atlas-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: atlas-windows-x64.zip

  linux:
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_APT_PACKAGES
      - name: Fetch libmpv
        run: python3 scripts/fetch_linux_libmpv.py --dest libmpv-prefix
      - run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release ${{ env.DART_DEFINES }}
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/libmpv-prefix/lib/pkgconfig:${{ github.workspace }}/libmpv-prefix/lib/x86_64-linux-gnu/pkgconfig
      - name: Bundle libmpv and libraries
        run: |
          BUNDLE_DIR=build/linux/x64/release/bundle
          LIBMPV_DIR=$(dirname "$(find libmpv-prefix -name 'libmpv.so' | head -1)")
          cp -a "$LIBMPV_DIR"/libmpv.so* "$BUNDLE_DIR/lib/"
          cp -a libmpv-prefix/lib/libshaderc_shared.so* "$BUNDLE_DIR/lib/"
          bash linux/packaging/bundle-libs.sh "$BUNDLE_DIR"
          cp linux/packaging/plezy.sh "$BUNDLE_DIR/plezy.sh"
          tar -czf atlas-linux-x64.tar.gz -C "$BUNDLE_DIR" .
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: atlas-linux-x64.tar.gz

  release:
    needs: [android, ios, macos, windows, linux]
    if: ${{ always() && inputs.release_tag != '' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: ls -R artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: true
          name: Atlas ${{ inputs.release_tag }}
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
